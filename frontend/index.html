<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class>

  <header>
    

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container"> 
    <span class="navbar-brand mb-0 h1">Expense Tracker</span>
  </div>
</nav>
  </header>

  <main class="container">

    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

    <div id="spinner" class="text-center my-4 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <section id="summary-section" class="mb-4 summary-grid">
  <div class="card text-center h-100">
    <div class="card-body">
      <h6 class="text-muted">Total</h6>
      <p class="fs-2 fw-bold mb-0" id="totalAmount">0.00</p>
    </div>
  </div>

  <div class="card text-center h-100">
    <div class="card-body">
      <h6 class="text-muted">Number of expenses</h6>
      <p class="fs-2 fw-bold mb-0" id="expenseCount">0</p>
    </div>
  </div>

  <div class="card text-center h-100">
    <div class="card-body">
      <h6 class="text-muted">Highest expense</h6>
      <p class="fs-2 fw-bold mb-0" id="highestAmount">0.00</p>
      <p class="text-muted mb-0" id="highestTitle"></p>
    </div>
  </div>
</section>

    <section id="add-expense-section" class="mb-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title mb-3">Add expense</h5>
          <form id="expenseForm" novalidate>
            <div class="row g-3">
              <div class="col-md-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" placeholder="Lunch">
              </div>
              <div class="col-md-3">
                <label for="amount" class="form-label">Amount</label>
                <input type="number" class="form-control" id="amount" placeholder="4.50">
              </div>
              <div class="col-md-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category">
                  <option value="" selected>Choose...</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="col-md-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date">
              </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3 " id="add-expense">Add expense</button>
          </form>
        </div>
      </div>
    </section>

    <!-- ---------- Section: Expenses Table ---------- -->
    <section id="expenses-section" class="mb-5">
  <div class="card shadow-sm ">
    <div class="card-header  bg-dark mb-4">
      <h5 class="card-title  text-light ">Expenses</h5>
    </div>

    <div class="card-body">
      <!-- Toolbar -->
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <!-- Search (left) -->
        <div class="d-flex gap-2">
          <input type="text" class="form-control" id="searchInput" placeholder="Enter a title">
          <button class="btn btn-primary" type="button" id="sbtn">Search</button>
        </div>

        <!-- Filter (right) -->
        <div class="d-flex align-items-center gap-2">
          <label for="categoryFilter" class="form-label mb-0 text-nowrap">Category</label>
          <select class="form-select w-auto" id="categoryFilter">
            <option value="All" selected>All</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <!-- Table -->
      <div class="table-responsive">
        <table class="table table-hover table-striped align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Title</th>
              <th>Amount</th>
              <th>Category</th>
              <th>Date</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="expensesTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</section>

  </main>

  <footer class="bg-dark text-light text-center py-3 mt-5">
    <div class="container">
      <small>Expense Tracker &mdash; Phase 2</small>
    </div>
  </footer>

  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editForm">
          <div class="modal-header">
            <h5 class="modal-title">Edit expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label for="editTitle" class="form-label">Title</label>
              <input type="text" class="form-control" id="editTitle">
            </div>
            <div class="mb-3">
              <label for="editAmount" class="form-label">Amount</label>
              <input type="number" step="0.01" class="form-control" id="editAmount">
            </div>
            <div class="mb-3">
              <label for="editCategory" class="form-label">Category</label>
              <select class="form-select" id="editCategory">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="editDate" class="form-label">Date</label>
              <input type="date" class="form-control" id="editDate">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
